# kvx redis 示例配置
#
# 原先只有 main.go 没有 config.yaml，configx 会降级为空配置，
# ReadAndCreate 恒报 "no stores configured" —— 示例根本跑不起来。
#
# 调用链：enable_trace 打开后 KV 操作会产 db.kvx.* span，宿主装配 otelx
# 后可在 Jaeger 看到；未装配时落在 noop provider 上，不影响功能。
kvx:
  stores:
    default:
      driver: redis
      addr: "127.0.0.1:6379"
      enable_trace: true
