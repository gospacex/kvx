# kvx/dragonfly（Dragonfly） - 独立开发环境
# 用法：scripts/start.sh / scripts/verify.sh / scripts/stop.sh
# 服务定义与 kvx/docker-compose.yml 中对应段一致，只改了容器名与网络名前缀，
# 避免与根 compose（一次起全套）重名冲突。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  dragonfly:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/dragonflydb/dragonfly:v1.25.3
    cpus: "0.5"
    container_name: hubx-kvx-dragonfly
    ports:
      - "${HOST_PORT:-6381}:6379"
      - "9175:9175"
    volumes:
      - ./data/dragonfly:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

networks:
  default:
    name: hubx-kvx-dragonfly-net
    driver: bridge
