# kvx/memcached（Memcached） - 独立开发环境
# 用法：scripts/start.sh / scripts/verify.sh / scripts/stop.sh
# 服务定义与 kvx/docker-compose.yml 中对应段一致，只改了容器名与网络名前缀，
# 避免与根 compose（一次起全套）重名冲突。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  memcached:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/memcached:1.6
    cpus: "0.3"
    container_name: hubx-kvx-memcached
    ports:
      - "${HOST_PORT:-11211}:11211"
    healthcheck:
      test: ["CMD", "memcached-tool", "127.0.0.1:11211", "stats"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

networks:
  default:
    name: hubx-kvx-memcached-net
    driver: bridge
